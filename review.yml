  - date: '2026-06-03'
    rating: 3
    summary: >-
      Warwick has a genuine, well-documented developer footprint led by its IT
      Services / IDG Software Engineering team. The Tabula REST API is the strongest
      asset, with detailed docs across timetabling, profiles, coursework, small group
      teaching and monitoring points, plus a sandbox; Files.Warwick and OAuth-protected
      web services (OAuth 1.0) are also documented. The Warwick SU Membership API and
      the WRAP institutional repository OAI-PMH endpoint round out the public surface.
      All documentation pages and the official verified GitHub org resolved HTTP 200.
      Access to most APIs is gated behind Warwick web sign-on / OAuth credentials, so
      they are not openly consumable without an account. No fabricated endpoints — only
      URLs and resources confirmed live were cataloged. Rated 3/5 for solid docs but
      credential-gated, account-only access.
