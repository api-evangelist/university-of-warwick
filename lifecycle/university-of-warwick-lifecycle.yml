note: >-
  Warwick publishes a real versioning commitment for Tabula, which is more than most of this
  cohort manages. What it does not publish is any deprecation policy, changelog, status page or
  sunset signalling — so a consumer can learn what "v1" promises but has no way to learn that
  anything changed.
versioning:
  scheme: uri-path
  current: v1
  base: https://tabula.warwick.ac.uk/api/v1
  in_path_versioning_of_operations: >-
    Some Tabula operations are independently versioned within the v1 tree — the member profile
    operations are documented as v2 forms (retrieve-member-v2, retrieve-multiple-members-v2,
    search-for-members-v2) while still living under /api/v1. Operation-level and path-level
    versions therefore do not agree.
  policy_published: true
  policy: >-
    Quoted from Warwick's own documentation: "We aim to never release backwards-incompatible
    changes to the Tabula API for the version requested. We may introduce more fields in the
    output in the same version, but will never remove or change the format of existing fields."
  policy_url: https://warwick.ac.uk/services/idg/services-support/web/tabula/api/
  additive_change_expected: true
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  detail: >-
    No deprecation policy, no RFC 8594 Sunset or Deprecation headers, and no announced end-of-life
    process for any Warwick API. The versioning promise implies old versions keep working but says
    nothing about how or whether they are ever retired.
