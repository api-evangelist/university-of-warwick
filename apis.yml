x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Warwick is one of the stronger institutions in this cohort and the profile is not thin. Six
    institution-operated surfaces were found and verified live on 2026-08-19, and two vendor
    surfaces were correctly demoted to tenant relationships rather than being credited as
    Warwick's. Three Tabula calendar endpoints returned live JSON and iCalendar unauthenticated;
    every gated Tabula path returned the documented 401 envelope rather than a 404, which
    confirmed the routes exist without credentials. The Shibboleth IdP metadata and the WRAP
    OAI-PMH endpoint were both fetched and parsed in full.


    What is genuinely absent, and is a finding about Warwick rather than about our reach: Warwick
    publishes no OpenAPI, AsyncAPI, JSON Schema, apis.json or Postman collection anywhere. Both
    OpenAPI documents in this repository are ours, derived from Warwick's prose documentation and
    live probes, and marked method: derived / probed. There is no changelog, status page,
    deprecation policy or public issue tracker.


    One surface was gated to us and is recorded as such rather than as absent: warwick.ac.uk/opensource
    returns HTTP 200 but renders a Web Sign-on wall for
    /services/idg/services-support/web/overview/sourcecode/, so Warwick's internal source-code and
    IDG engineering pages could not be read. No pointer is emitted to it.
  evidence:
    - url: https://tabula.warwick.ac.uk/api/v1/termdates
      status: 200
    - url: https://tabula.warwick.ac.uk/api/v1/termdates/weeks
      status: 200
    - url: https://tabula.warwick.ac.uk/api/v1/holidaydates
      status: 200
    - url: https://tabula.warwick.ac.uk/api/v1/holidaydates.ics
      status: 200
    - url: https://tabula.warwick.ac.uk/api/v1/department
      status: 401
    - url: https://idp.warwick.ac.uk/idp/shibboleth
      status: 200
    - url: https://wrap.warwick.ac.uk/cgi/oai2?verb=Identify
      status: 200
    - url: https://wrap.warwick.ac.uk/cgi/oai2?verb=ListMetadataFormats
      status: 200
    - url: https://warwick.ac.uk/llms.txt
      status: 200
    - url: https://warwick.ac.uk/about?markdown
      status: 200
    - url: https://warwick.ac.uk/.well-known/security.txt
      status: 200
