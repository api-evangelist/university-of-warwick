---
aid: university-of-warwick
name: University of Warwick
description: >-
  The University of Warwick is a public research university in Coventry, England,
  ranked #49 in the QS World University Rankings 2025. Its developer/API footprint
  is provided primarily by the institution's Software Engineering / IT Services and
  IDG teams. Public, documented APIs include the Tabula REST API (teaching and
  learning administration, including timetabling, profiles, coursework, small group
  teaching and monitoring points), the Files.Warwick file APIs, and OAuth-protected
  Warwick web services. The Warwick Students' Union additionally publishes a
  Membership API, and the Warwick Research Archive Portal (WRAP) exposes harvestable
  metadata via OAI-PMH. Most APIs require Warwick web sign-on / OAuth credentials and
  are not openly available without an account.
