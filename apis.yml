- aid: university-of-warwick:su-membership
  name: Warwick SU Membership API
  description: >-
    The Warwick Students' Union publishes a Membership API for validating membership and retrieving member
    rosters. Two reasons this is not credited to the University: the Students' Union is a separate legal
    entity from the University, and the site is served by the MSL platform (its HTML identifies itself
    as "Powered by www.ukmsl.com"), so the contract is the vendor's. Recorded as a tenant relationship
    for completeness.
  x-operator: tenant
