aid: university-of-warwick
name: University of Warwick
description: >-
  The University of Warwick is a public research university in Coventry, England, and a member of
  the Russell Group. Unusually for this cohort, Warwick genuinely operates its own programmable
  surface rather than pointing at a vendor's: Tabula, its teaching-and-learning administration
  system, is built and run by Warwick's own Information and Digital Group (IDG) software
  engineering team and exposes a documented, versioned REST API on tabula.warwick.ac.uk — three
  of whose calendar endpoints (term dates, term weeks, holiday dates) are fully public, return
  live JSON and iCalendar without credentials, and were verified working on 2026-08-19. Warwick
  also runs its own central identity infrastructure: a Shibboleth SAML 2.0 identity provider at
  idp.warwick.ac.uk publishing unauthenticated, machine-readable federation metadata carrying
  REFEDS SIRTFI and Research-and-Scholarship entity attributes, plus a Web Sign-on OAuth 1.0a
  service with nine documented Warwick-specific scopes. Its institutional repository, WRAP, is a
  self-hosted EPrints instance on Warwick infrastructure serving a live OAI-PMH 2.0 endpoint with
  seven metadata formats including RIOXX 2.0 and OpenAIRE. Warwick additionally publishes an
  llms.txt that documents a real agent affordance rather than merely listing links — appending
  `?markdown` to any warwick.ac.uk page returns that page as Markdown, which was verified.

  The honest limits: Warwick publishes no OpenAPI, AsyncAPI, JSON Schema or Postman collection
  for any of its APIs — every machine-readable contract in this repository was derived by API
  Evangelist from Warwick's documentation and live probes, and is marked as such. There is no
  changelog, no status page, no deprecation policy and no public issue tracker. Most of the
  surface is gated behind Warwick Web Sign-on and is not consumable without an institutional
  account, sandbox access is by email request rather than self-service, and the delegated
  authorization standard is OAuth 1.0a rather than OAuth 2.0 or OIDC. Its library discovery and
  students' union surfaces are vendor platforms running under Warwick-specific hostnames and are
  recorded here as tenant relationships, not as Warwick's engineering.
