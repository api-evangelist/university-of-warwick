apis:
- aid: university-of-warwick:identity-federation
  name: Warwick Shibboleth Identity Provider
  description: >-
    Warwick's Shibboleth SAML 2.0 identity provider. Publishes unauthenticated, machine-readable federation
    metadata as a SAML EntityDescriptor with entityID https://idp.warwick.ac.uk/idp/shibboleth, a shibmd:Scope
    of warwick.ac.uk, and entity attributes asserting REFEDS SIRTFI assurance certification and the REFEDS
    Research and Scholarship entity category. Institution-operated by definition — a university cannot
    outsource being its own identity authority — and this is the single most substantive machine-readable
    artifact Warwick publishes.
  x-operator: institution
  x-operator-evidence: >-
    Host idp.warwick.ac.uk is Warwick's own; the metadata asserts entityID and scope under warwick.ac.uk
    and is signed with a certificate issued to idp.warwick.ac.uk.
  humanURL: https://warwick.ac.uk/services/its/servicessupport/web/sign-on/
  baseURL: https://idp.warwick.ac.uk/idp/shibboleth
  tags:
  - Identity Federation
  - SAML
  - Shibboleth
  - Authentication
  - Education
  properties:
  - type: IdentityFederation
    url: https://idp.warwick.ac.uk/idp/shibboleth
  - type: Authentication
    url: authentication/university-of-warwick-authentication.yml
  - type: Conformance
    url: conformance/university-of-warwick-conformance.yml
- aid: university-of-warwick:oauth
  name: Warwick Web Sign-on OAuth Services
  description: >-
    OAuth 1.0a delegated access to Warwick web services — Sitebuilder (separate read and edit scopes),
    Warwick Search, Files.Warwick, Warwick Blogs, Warwick Forums, Exam Timetabling, Printer Credits and
    Web Sign-on itself. Signed with RSA-SHA1 or HMAC-SHA1. Uses a Warwick-specific `scope` parameter that
    is not part of the OAuth standard and cannot travel in the Authorization header. Applications must
    be registered with the ITS Web Team before a token will be issued. Note this is OAuth 1.0a, not OAuth
    2.0, and there is no OIDC discovery document — /.well-known/openid-configuration returns 404.
  x-operator: institution
  x-operator-evidence: >-
    Token endpoints are on websignon.warwick.ac.uk, Warwick's own host; the scope URNs name Warwick services
    exclusively.
  humanURL: https://warwick.ac.uk/services/its/servicessupport/web/sign-on/help/oauth/apis/
  x-baseurl-note: >-
    No baseURL is emitted. https://websignon.warwick.ac.uk/oauth returns HTTP 404 — there is no resource
    at the OAuth path root, only the three named token endpoints. Those are recorded in authentication/university-of-warwick-authentication.yml
    rather than emitted as a pointer that would grade dead.
  tags:
  - Authentication
  - Identity
  - Education
  tags_raw:
  - Authentication
  - OAuth
  - Identity
  - Education
  properties:
  - type: Documentation
    url: https://warwick.ac.uk/services/its/servicessupport/web/sign-on/help/oauth/apis/
