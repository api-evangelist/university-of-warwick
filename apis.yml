- aid: university-of-warwick:moodle
  name: Warwick Moodle Web Services
  description: >-
    Warwick runs a Moodle virtual learning environment at moodle.warwick.ac.uk. The Moodle web service
    endpoint is live and responds to unauthenticated requests with a well-formed Moodle exception, confirming
    the surface exists. Recorded for completeness with an important caveat: the host and the instance
    are Warwick's, but the API contract is upstream Moodle's, so no specification is derived or saved
    here — crediting Warwick for Moodle's engineering would be the same error this pipeline exists to
    prevent. Note also that the Moodle homepage returned HTTP 500 when probed on 2026-08-19.
  x-operator: institution
  x-operator-evidence: >-
    moodle.warwick.ac.uk is under Warwick's own registrable domain and is a self-hosted instance; however
    the contract itself is defined by the Moodle project, not by Warwick.
  baseURL: https://moodle.warwick.ac.uk/webservice/rest/server.php
  x-humanurl-note: >-
    No humanURL is emitted. https://moodle.warwick.ac.uk/ returns HTTP 500 to anonymous visitors on every
    attempt — a Shibboleth "Single Sign-on - Stale Request" page served with a 500 — and Warwick publishes
    no public Moodle information page (/services/its/servicessupport/web/moodle/ and /services/academictechnology/moodle/
    both 404). Only the web service endpoint is live, so only it is emitted.
  tags:
  - Learning Management
  - Education
- aid: university-of-warwick:library-discovery
  name: Warwick Library Discovery (Summon)
  description: >-
    Warwick's library discovery layer. encore.lib.warwick.ac.uk issues an HTTP 302 to warwick.summon.serialssolutions.com
    — a Warwick-specific tenancy on the Summon platform operated by Serials Solutions / ProQuest. This
    is a real institutional fact and one of Warwick's genuine surface classes, but the contract belongs
    to the vendor. Recorded as a tenant relationship; no vendor specification is saved under this institution.
  x-operator: tenant
  x-operator-evidence: >-
    encore.lib.warwick.ac.uk 302-redirects to warwick.summon.serialssolutions.com, a Warwick-named account
    on a vendor-operated platform. Probed 2026-08-19.
  x-vendor: Serials Solutions (ProQuest) Summon
  humanURL: https://warwick.ac.uk/services/library/
  tags:
